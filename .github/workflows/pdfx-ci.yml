name: pdfx-ci

on:
  pull_request:
    branches:
      - feat/pdfx-support
  push:
    branches:
      - feat/pdfx-support

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@36447784f29e3b0d3556b513576f7412e9472e41
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@d4323d4df104b026a6e5690415ed9a30d4502211
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,test]
          pip install pyright pre-commit

      - name: Run pre-commit hooks (format, typos, pylint hooks)
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Run format check (black)
        run: black --check .

      - name: Run linters (pylint)
        run: pylint fpdf || true

      - name: Type checking (mypy + pyright)
        continue-on-error: true
        run: |
          mypy
          pyright

      - name: Run tests
        run: pytest -q

      - name: Upload test results (optional)
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: pytest-results
          path: ./tests/.pytest_cache || ./htmlcov || ./coverage.xml
